<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Projector Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #timer-display {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
      font-size: min(28vw, 55vh);
      transition: color 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="timer-display">00:00</div>

  <script>
    let remainingSeconds = 0;
    let timerInterval = null;
    let controlWindow = null;
    let bellInterval = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBell() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (bellInterval) return;

      function singleBeep() {
        const frequencies = [587.33, 880, 1174.66];
        const now = audioCtx.currentTime;

        frequencies.forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.8);
        });
      }

      singleBeep();
      bellInterval = setInterval(singleBeep, 1000);
    }

    function stopBell() {
      if (bellInterval) {
        clearInterval(bellInterval);
        bellInterval = null;
      }
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const pad = (n) => String(n).padStart(2, '0');

      return hrs > 0 
        ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}`
        : `${pad(mins)}:${pad(secs)}`;
    }

    function updateDisplay() {
      const display = document.getElementById('timer-display');
      display.textContent = formatTime(remainingSeconds);

      if (controlWindow && !controlWindow.closed) {
        controlWindow.postMessage({
          type: 'SYNC',
          seconds: remainingSeconds,
          isRunning: timerInterval !== null
        }, '*');
      }
    }

    function startTimer() {
      if (timerInterval || remainingSeconds <= 0) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopBell();

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        }
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          playBell();
          document.getElementById('timer-display').style.color = '#ef4444';
          updateDisplay();
        }
      }, 1000);
    }

    function pauseTimer() {
      stopBell();
      clearInterval(timerInterval);
      timerInterval = null;
      updateDisplay();
    }

    function resetTimer(seconds = 0) {
      pauseTimer();
      stopBell();
      remainingSeconds = seconds;
      document.getElementById('timer-display').style.color = '#ffffff';
      updateDisplay();
    }

    function openControlPanel() {
      if (controlWindow && !controlWindow.closed) {
        controlWindow.focus();
        return;
      }

      controlWindow = window.open('', 'TimerRemote', 'width=380,height=480,top=100,left=100');

      const panelHTML = `
        <!DOCTYPE html>
        <html>
        <head>
          <title>Presenter Control Room</title>
          <style>
            body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 20px; margin: 0; }
            h3 { margin-top: 0; font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
            .inputs { display: flex; gap: 8px; margin-bottom: 16px; }
            .inputs div { flex: 1; }
            label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
            input { width: 100%; box-sizing: border-box; background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 1.2rem; text-align: center; }
            .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
            button { background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
            button:hover { filter: brightness(1.1); }
            button:active { filter: brightness(0.9); }
            .btn-secondary { background: #27272a; border: 1px solid #3f3f46; }
            .btn-danger { background: #dc2626; }
            .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .presets button { background: #1f2937; padding: 10px; font-size: 0.85rem; border: 1px solid #374151; }
            #status-bar { margin-top: 20px; padding: 10px; text-align: center; border-radius: 4px; background: #18181b; font-size: 0.85rem; color: #a1a1aa; }
          </style>
        </head>
        <body>
          <h3>Set Custom Duration</h3>
          <div class="inputs">
            <div><label>Hours</label><input id="h" type="number" min="0" value="0"></div>
            <div><label>Minutes</label><input id="m" type="number" min="0" value="5"></div>
            <div><label>Seconds</label><input id="s" type="number" min="0" value="0"></div>
          </div>
          <div class="btn-grid">
            <button class="btn-secondary" onclick="applyTime()">Set Duration</button>
            <button onclick="window.opener.startTimer()">Start</button>
            <button class="btn-secondary" onclick="window.opener.pauseTimer()">Pause</button>
            <button class="btn-danger" onclick="window.opener.resetTimer(0)">Clear (00:00)</button>
          </div>

          <h3>Quick Jump</h3>
          <div class="presets">
            <button onclick="quickSet(1)">1 Min</button>
            <button onclick="quickSet(2)">2 Min</button>
            <button onclick="quickSet(4)">4 Min</button>
            <button onclick="quickSet(8)">8 Min</button>
            <button onclick="quickSet(10)">10 Min</button>
            <button onclick="quickSet(12)">12 Min</button>
          </div>

          <div id="status-bar">Connecting to Projector...</div>

          <script>
            function applyTime() {
              const h = parseInt(document.getElementById('h').value) || 0;
              const m = parseInt(document.getElementById('m').value) || 0;
              const s = parseInt(document.getElementById('s').value) || 0;
              window.opener.resetTimer((h * 3600) + (m * 60) + s);
            }

            function quickSet(mins) {
              document.getElementById('h').value = 0;
              document.getElementById('m').value = mins;
              document.getElementById('s').value = 0;
              applyTime();
            }

            window.addEventListener('message', (e) => {
              if (e.data.type === 'SYNC') {
                const s = e.data.seconds;
                const hrs = Math.floor(s / 3600);
                const mins = Math.floor((s % 3600) / 60);
                const secs = s % 60;
                const pad = (n) => String(n).padStart(2, '0');
                const timeStr = hrs > 0 ? pad(hrs)+':'+pad(mins)+':'+pad(secs) : pad(mins)+':'+pad(secs);
                
                document.getElementById('status-bar').innerText = 
                  (e.data.isRunning ? 'Running: ' : 'Paused: ') + timeStr;
              }
            });
          <\/script>
        </body>
        </html>
      `;

      controlWindow.document.write(panelHTML);
      controlWindow.document.close();
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'c') openControlPanel();
      if (key === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen();
        }
      }
      if (key === ' ') {
        e.preventDefault();
        if (timerInterval) pauseTimer();
        else startTimer();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
